# CI — runs BOTH test surfaces for the S-760 project:
#   1. backend  : C++ core/plugin tests + the Python `pytest tests` suite
#                 (needs the pybind11 `s760_cpp` module built into `tests/`).
#   2. frontend : the google-ui React suites — Vitest (unit/component) and
#                 Playwright (E2E / visual snapshots of the composed shell).
#
# ui-consolidation task 4.4 (R7.3): "CI SHALL run the React test suite alongside
# pytest."  The two jobs run independently and in parallel; `all-tests` gates on
# both so a red suite fails the overall check.
#
# Platform notes / prerequisites encoded here:
#   * The C++ toolchain + the `s760.ps1` analyzer the Python suite shells out to
#     are Windows/MSVC/PowerShell based (see docs/TESTING.md and the
#     s760-build-and-test runbook), so the backend job runs on windows-latest and
#     targets Python 3.13 (core/CMakeLists.txt `find_package(Python 3.13 ...)`).
#   * The MAME binary (`mames760.exe`) and the S-760 ROM set are local/hardware
#     artifacts that are NOT committed to the repo. The MAME-driven UI tests skip
#     gracefully when that binary is absent (tests/mame_harness.py honors
#     S760_MAME_EXE / S760_ROMS_DIR), so `pytest tests` runs green in CI without
#     them. To exercise the MAME path, provision the binary + ROMs on a self-hosted
#     runner and set those env vars.
#   * google-ui/.npmrc pins `legacy-peer-deps=true`; npm honors it automatically
#     for `npm ci` / `npm install`.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: C++ core/plugin tests + Python pytest suite.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend (C++ core + pytest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python build/test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # pybind11: required by core/CMakeLists.txt to build the s760_cpp module.
          # pytest + Pillow(PIL): the test suite imports pytest and PIL (mame_harness).
          # NumPy/SciPy: band-limited hardware-capture reference and alias tests.
          python -m pip install pybind11 pytest Pillow numpy scipy

      - name: Configure CMake (Release)
        shell: pwsh
        run: cmake -S core -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ core, plugins, tests, and the s760_cpp Python module
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run C++ core tests
        shell: pwsh
        run: .\build\Release\s760_core_tests.exe

      - name: Run C++ plugin tests
        shell: pwsh
        run: .\build\Release\s760_plugin_tests.exe

      - name: Run C++ bridge tests
        shell: pwsh
        run: .\build\Release\s760_bridge_tests.exe

      # The pybind11 module is emitted into `tests/` (LIBRARY/RUNTIME_OUTPUT_DIRECTORY
      # in core/CMakeLists.txt), so `import s760_cpp` resolves when pytest runs there.
      - name: Run Python test suite (pytest tests)
        shell: pwsh
        run: pytest tests

  # ---------------------------------------------------------------------------
  # Frontend: google-ui React suites — Vitest + Playwright.
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend (Vitest + Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: google-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: google-ui/package-lock.json

      # npm honors google-ui/.npmrc (legacy-peer-deps=true) automatically.
      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (unit/component)
        run: npm run test

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts its own webServer (vite build + preview),
      # so no separate dev-server step is needed here.
      - name: Run Playwright (E2E / visual)
        run: npm run test:e2e

  # ---------------------------------------------------------------------------
  # Aggregate gate: fails if either suite failed.
  # ---------------------------------------------------------------------------
  all-tests:
    name: All test suites
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()
    steps:
      - name: Verify both suites succeeded
        run: |
          echo "backend-tests:  ${{ needs.backend-tests.result }}"
          echo "frontend-tests: ${{ needs.frontend-tests.result }}"
          if [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "::error::One or more test suites failed."
            exit 1
          fi
          echo "Both suites passed."
